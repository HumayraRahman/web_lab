<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="liststyle copy.css">
</head>

<body>

    <!-- Main To-Do List Container -->
    <div class="todo-container">

        <!-- Heading -->
        <h1>To-Do List</h1>


        <!-- Input Area -->
        <div class="input-area">

            <!-- Task Input -->
            <input
                type="text"
                id="taskInput"
                placeholder="Add a new task..."
                autocomplete="off"
            >

            <!-- Add Button -->
            <button id="addButton">
                Add
            </button>

        </div>


        <!-- Task List -->
        <ul id="taskList">

            <!-- JavaScript will add tasks here -->

        </ul>

    </div>


    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
